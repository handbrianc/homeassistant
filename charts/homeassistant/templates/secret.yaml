{{/*
Chart-managed Secret fallback for pure-helm users (values key secretEnv).
Rendered ONLY when secretEnv is a non-empty map; the scripts lane always uses
the external envFromSecret instead. No secret material ever lands in a
ConfigMap.
*/}}
{{- if .Values.secretEnv -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "homeassistant.fullname" . }}-secret
  labels:
    {{- include "homeassistant.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- toYaml .Values.secretEnv | nindent 2 }}
{{- end }}
