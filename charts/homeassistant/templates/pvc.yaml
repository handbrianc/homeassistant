{{/*
PersistentVolumeClaim for /config. Rendered only when persistence is enabled
and no existing claim is referenced; the StatefulSet consumes it by name via a
pod volume (NOT volumeClaimTemplates, so claim/storage-class changes stay
manageable across upgrades).
*/}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "homeassistant.fullname" . }}-config
  labels:
    {{- include "homeassistant.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode | quote }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
